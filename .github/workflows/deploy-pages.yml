name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; the default GITHUB_TOKEN permissions are not enough.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The service-worker minifier runs in worker threads, where Node 18
          # does not expose `crypto`. 20+ is required to build.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Project sites are served from /<repo>/, so assets, the manifest
          # scope and the router basename all need that prefix.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Firebase web config: public identifiers, not secrets. Firestore
          # rules are what protect the data. Stored as repository *variables*
          # so they are visible and easy to correct.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Fail early if the config was not injected
        run: |
          if grep -rq "VITE_FIREBASE_API_KEY" dist/assets/*.js; then
            echo "::error::Firebase config was not substituted — set the repository variables under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          if [ ! -f dist/404.html ]; then
            echo "::error::404.html missing — deep links would break on Pages."
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
