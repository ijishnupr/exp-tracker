<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Kept in sync with the app's own theme by src/lib/theme.js, so the
         status bar follows the in-app toggle rather than only the OS. The
         value here is the pre-JS default; the manifest's theme_color stays
         blue for the install splash, which cannot be changed at runtime. -->
    <meta name="theme-color" content="#f9f9f7" />
    <meta name="description" content="Track spending, set budgets, and export to Excel — works offline." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Expense Tracker</title>
    <!-- Paints the app's own background on the very first frame, before any
         JavaScript has loaded. On an installed app the launch splash (icon on
         a coloured screen) stays up until the page first paints, so without
         this it lingered for as long as the bundles took to parse. The saved
         theme is applied here too, so a dark-mode user never sees a light
         flash. main.jsx applies the same setting again once the app runs. -->
    <script>
      try {
        var t = localStorage.getItem('exp-tracker:theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
      // Status bar to match from the first frame, not only once the app runs.
      try {
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000')
      } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; background: #f9f9f7; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']), html:not([data-theme='light']) body { background: #000; }
      }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #000; }

      /* Launch logo: the app icon drawn inline (nothing to download), its bars
         rising in turn like the bars inside the app. It sits over the app
         while the app loads underneath, and main.jsx fades it out once the
         app has rendered, after at most about half a second. */
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #f9f9f7;
        transition: opacity 180ms ease-out;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) #boot { background: #000; }
      }
      html[data-theme='dark'] #boot { background: #000; }
      #boot.boot-out { opacity: 0; pointer-events: none; }
      #boot svg { width: 88px; height: 88px; animation: boot-in 260ms cubic-bezier(0.22, 0.8, 0.36, 1) both; }
      #boot .bar {
        transform-box: fill-box; transform-origin: bottom;
        animation: boot-bar 320ms cubic-bezier(0.22, 0.8, 0.36, 1) both;
      }
      #boot .bar:nth-of-type(2) { animation-delay: 70ms; }
      #boot .bar:nth-of-type(3) { animation-delay: 140ms; }
      @keyframes boot-in { from { opacity: 0; transform: scale(0.86); } }
      @keyframes boot-bar { from { transform: scaleY(0); } }
      @media (prefers-reduced-motion: reduce) {
        #boot svg, #boot .bar { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
        <rect width="192" height="192" rx="38" fill="#2a78d6" />
        <g fill="#fff">
          <rect class="bar" x="42" y="92" width="27" height="39" rx="7" />
          <rect class="bar" x="82" y="66" width="27" height="65" rx="7" />
          <rect class="bar" x="122" y="38" width="27" height="93" rx="7" />
          <rect x="42" y="145" width="108" height="6" rx="3" />
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
