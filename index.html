<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Kept in sync with the app's own theme by src/lib/theme.js, so the
         status bar follows the in-app toggle rather than only the OS. The
         value here is the pre-JS default; the manifest's theme_color stays
         blue for the install splash, which cannot be changed at runtime. -->

    <meta name="description" content="Track spending, set budgets, and export to Excel — works offline." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Expense Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
