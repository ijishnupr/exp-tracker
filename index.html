<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Black while the launch logo shows, matching the manifest's splash
         colours, so on Android the status bar is not a light band over the
         black launch screen. main.jsx hands it to src/lib/theme.js (which
         follows the in-app theme) as the logo fades. -->
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Track spending, set budgets, and export to Excel — works offline." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Expense Tracker</title>
    <!-- Paints the app's own background on the very first frame, before any
         JavaScript has loaded. On an installed app the launch splash (icon on
         a coloured screen) stays up until the page first paints, so without
         this it lingered for as long as the bundles took to parse. The saved
         theme is applied here too, so a dark-mode user never sees a light
         flash. main.jsx applies the same setting again once the app runs. -->
    <script>
      try {
        var t = localStorage.getItem('exp-tracker:theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
      // The installed app on Android opens behind the system's own splash
      // (the icon on the manifest colour), and no page can line its logo up
      // with that one exactly across devices, so a second logo after it read
      // as a flick. There, the system logo is the launch logo: ours is
      // skipped before it can paint. Browser tabs, desktop and iOS have no
      // system logo, so they keep the animated one.
      try {
        var installed = ['standalone', 'fullscreen', 'minimal-ui'].some(function (m) {
          return matchMedia('(display-mode: ' + m + ')').matches
        })
        if (installed && /Android/i.test(navigator.userAgent)) {
          document.documentElement.classList.add('os-splash')
        }
      } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; background: #f9f9f7; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']), html:not([data-theme='light']) body { background: #000; }
      }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #000; }

      /* Launch logo. Android shows its own splash first (the app icon on the
         manifest's background_color, black) and removes it on the page's
         first paint. This layer is that splash's continuation: black in
         every theme, the icon at the same 128px size, centred, with every bar
         already full, so the hand-over is invisible. Only then do the bars
         bounce, and the layer fades out as the app underneath is ready. */
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #000;
        transition: opacity 120ms ease-out;
      }
      #boot.boot-out { opacity: 0; pointer-events: none; }
      html.os-splash #boot { display: none; }
      #boot svg { width: 128px; height: 128px; transition: transform 120ms ease-out; }
      #boot.boot-out svg { transform: scale(1.06); }
      #boot .bar {
        transform-box: fill-box; transform-origin: bottom;
        animation: boot-bar 200ms cubic-bezier(0.33, 0, 0.2, 1) both;
      }
      #boot .bar:nth-of-type(2) { animation-delay: 30ms; }
      #boot .bar:nth-of-type(3) { animation-delay: 60ms; }
      @keyframes boot-bar {
        0% { transform: scaleY(1); }
        40% { transform: scaleY(0.4); }
        100% { transform: scaleY(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
        <rect width="192" height="192" rx="38" fill="#2a78d6" />
        <g fill="#fff">
          <rect class="bar" x="42" y="92" width="27" height="39" rx="7" />
          <rect class="bar" x="82" y="66" width="27" height="65" rx="7" />
          <rect class="bar" x="122" y="38" width="27" height="93" rx="7" />
          <rect x="42" y="145" width="108" height="6" rx="3" />
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
