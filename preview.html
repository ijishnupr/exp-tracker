<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview — Expense Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <pre id="err" style="white-space:pre-wrap;color:#b00;font:12px monospace"></pre>
    <script>
      // ?theme=light|dark forces a mode, so both palettes can be screenshotted.
      const t = new URLSearchParams(location.search).get('theme')
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      // ?click=<button text> clicks that button once mounted, so interactive
      // states (confirm dialogs, toggles) can be screenshotted headlessly.
      const want = new URLSearchParams(location.search).get('click')
      if (want) {
        setTimeout(() => {
          const b = [...document.querySelectorAll('button')]
            .find((el) => el.textContent.trim().toLowerCase() === want.toLowerCase())
          if (b) b.click()
        }, 700)
      }
      // ?audit=1 measures interactive elements against mobile guidance:
      // 44x44 minimum tap target, and >=16px font on inputs (below that iOS
      // Safari auto-zooms the page on focus).
      if (new URLSearchParams(location.search).get('audit') === '1') {
        setTimeout(() => {
          const out = [`viewport innerWidth=${innerWidth} clientWidth=${document.documentElement.clientWidth}`]
          const seen = new Set()
          for (const el of document.querySelectorAll('button,a,input,select,textarea,[role="button"]')) {
            const r = el.getBoundingClientRect()
            if (!r.width || !r.height) continue
            const cs = getComputedStyle(el)
            const label = (el.getAttribute('aria-label') || el.textContent || el.type || el.tagName)
              .trim().slice(0, 28) || el.tagName
            if (r.height < 44 || r.width < 44) {
              const k = 'T' + label + Math.round(r.width) + Math.round(r.height)
              if (!seen.has(k)) { seen.add(k)
                out.push(`TAP  ${Math.round(r.width)}x${Math.round(r.height)}  ${el.tagName.toLowerCase()}  "${label}"`) }
            }
            if (/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) {
              const fs = parseFloat(cs.fontSize)
              if (fs < 16) {
                const k = 'F' + label + fs
                if (!seen.has(k)) { seen.add(k)
                  out.push(`ZOOM ${fs}px  ${el.tagName.toLowerCase()}  "${label}"`) }
              }
            }
          }
          const de = document.documentElement
          if (de.scrollWidth > de.clientWidth)
            out.push(`OVERFLOW page scrolls sideways: ${de.scrollWidth} > ${de.clientWidth}`)
          document.getElementById('err').textContent = out.join('\n') || 'no mobile issues found'
        }, 900)
      }
      // ?swipe=left|right fires a synthetic touch gesture across <main>, so
      // swipe navigation can be exercised headlessly.
      const sw = new URLSearchParams(location.search).get('swipe')
      if (sw) {
        setTimeout(() => {
          const main = document.querySelector('main')
          if (!main) return
          const r = main.getBoundingClientRect()
          const y = r.top + r.height / 2
          const from = sw === 'left' ? r.right - 40 : r.left + 40
          const to = sw === 'left' ? r.left + 40 : r.right - 40
          const mode = new URLSearchParams(location.search).get('mode') || 'normal'
          const type = mode === 'mouse' ? 'mouse' : 'touch'
          const opts = (x, yy) => ({ bubbles: true, cancelable: true, clientX: x, clientY: yy ?? y,
                                     pointerId: 1, pointerType: type, isPrimary: true })
          let a = [from, y], b = [to, y]
          if (mode === 'vertical') { a = [r.left + 60, r.top + 40]; b = [r.left + 90, r.top + 400] }
          if (mode === 'short')    { a = [from, y]; b = [from - 25, y] }
          const target = mode === 'oninput'
            ? (document.querySelector('main input, main select') || main) : main
          target.dispatchEvent(new PointerEvent('pointerdown', opts(a[0], a[1])))
          target.dispatchEvent(new PointerEvent('pointerup', opts(b[0], b[1])))
          setTimeout(() => {
            const active = [...document.querySelectorAll('nav a')]
              .find((a) => a.className.includes('text-series'))
            document.getElementById('err').textContent =
              'after swipe ' + sw + ': active tab = ' + (active ? active.textContent.trim() : 'none')
          }, 400)
        }, 900)
      }
      // ?themecolor=1 reports the live <meta name="theme-color"> value.
      if (new URLSearchParams(location.search).get('themecolor') === '1') {
        setTimeout(() => {
          const m = document.querySelector('meta[name="theme-color"]:not([media])')
          const root = document.documentElement.getAttribute('data-theme') || 'system'
          document.getElementById('err').textContent =
            'data-theme=' + root + '  meta theme-color=' + (m ? m.content : 'MISSING')
        }, 800)
      }
      const show = (m) => { document.getElementById('err').textContent += m + '\n\n' }
      window.addEventListener('error', (e) => show('ERROR: ' + (e.error?.stack || e.message)))
      window.addEventListener('unhandledrejection', (e) => show('REJECT: ' + (e.reason?.stack || e.reason)))
    </script>
    <script type="module" src="/src/preview.jsx"></script>
  </body>
</html>
